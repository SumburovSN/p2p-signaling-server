# /etc/turnserver.conf
# ==========================================
# coTURN для P2P VideoChat
# ==========================================

# Сетевой интерфейс / IP нашего VDS
listening-ip=157.22.190.19
relay-ip=157.22.190.19

# Основные STUN/TURN порты
listening-port=3478
tls-listening-port=5349

# ==========================================
# Аутентификация
# ==========================================

lt-cred-mech
realm=sumburovsn.fvds.ru

# ==========================================
# Relay ports
# ==========================================

min-port=49160
max-port=49200

# ==========================================
# TLS
# ==========================================

# cert=/etc/letsencrypt/live/sumburovsn.fvds.ru/fullchain.pem
# pkey=/etc/letsencrypt/live/sumburovsn.fvds.ru/privkey.pem
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# ==========================================
# Безопасность
# ==========================================

fingerprint
no-cli

# Не используем loopback и multicast
# no-loopback-peers
no-multicast-peers

# ==========================================
# Логирование
# ==========================================

# simple-log
# log-file=/var/log/turnserver/turnserver.log